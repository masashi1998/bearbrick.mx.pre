<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BEARBRICK AR Exhibition</title>

  <!-- Google model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: "Helvetica Neue", Arial, sans-serif; background: #000; color: #fff; overflow: hidden; }

    /* ===== Layout ===== */
    .app { display: flex; flex-direction: column; height: 100dvh; }

    /* ===== Header ===== */
    .header {
      text-align: center;
      padding: 12px 16px 8px;
      background: linear-gradient(135deg, #111, #222);
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    .header h1 { font-size: 1.2rem; letter-spacing: .15em; font-weight: 700; }
    .header p  { font-size: .7rem; color: #aaa; margin-top: 2px; }

    /* ===== model-viewer ===== */
    model-viewer {
      flex: 1;
      width: 100%;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 80%);
      --poster-color: transparent;
    }
    /* AR button styling override */
    model-viewer::part(default-ar-button) {
      top: auto; bottom: 80px; right: 16px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 24px;
      padding: 8px 18px;
      color: #fff;
      font-size: .85rem;
      backdrop-filter: blur(8px);
    }

    /* ===== Bottom Bar ===== */
    .bottom-bar {
      padding: 12px 16px 20px;
      background: linear-gradient(0deg, #111 60%, transparent);
      text-align: center;
      z-index: 10;
    }
    .btn-preorder {
      display: inline-block;
      width: 100%;
      max-width: 360px;
      padding: 14px 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: #000;
      background: linear-gradient(135deg, #f5d020, #f53803);
      border: none;
      border-radius: 32px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .btn-preorder:active { transform: scale(.97); }
    .btn-preorder:hover  { box-shadow: 0 4px 24px rgba(245, 208, 32, .4); }

    /* ===== Modal Overlay ===== */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(6px);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }

    /* ===== Modal ===== */
    .modal {
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 32px;
      animation: slideUp .3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal h2 { text-align: center; font-size: 1.1rem; margin-bottom: 20px; letter-spacing: .08em; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: .75rem;
      color: #aaa;
      margin-bottom: 6px;
      letter-spacing: .05em;
    }
    .form-group label .required { color: #f53803; margin-left: 4px; }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: .95rem;
      background: #2c2c2e;
      border: 1px solid #444;
      border-radius: 10px;
      color: #fff;
      outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus { border-color: #f5d020; }
    .form-group input::placeholder { color: #666; }

    .btn-submit {
      width: 100%;
      padding: 14px 0;
      margin-top: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: #000;
      background: linear-gradient(135deg, #f5d020, #f53803);
      border: none;
      border-radius: 32px;
      cursor: pointer;
      transition: transform .15s, opacity .15s;
    }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
    .btn-submit:active:not(:disabled) { transform: scale(.97); }

    .btn-close {
      display: block;
      margin: 16px auto 0;
      background: none;
      border: none;
      color: #888;
      font-size: .85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ===== Toast ===== */
    .toast {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,.9);
      color: #f5d020;
      padding: 20px 32px;
      border-radius: 14px;
      font-size: .95rem;
      font-weight: 600;
      text-align: center;
      z-index: 200;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(245,208,32,.3);
    }
    .toast.show { display: block; animation: fadeInOut 2.5s ease-in-out; }
    @keyframes fadeInOut { 0%{opacity:0} 15%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
  </style>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1>BE@RBRICK</h1>
      <p>AR EXHIBITION</p>
    </header>

    <!-- 3D / AR Viewer -->
    <!--
      .glb ファイルのパスを src="" に指定してください。
      例: src="./models/bearbrick_400.glb"
      poster="" にはサムネイル画像を指定できます（任意）。
    -->
    <model-viewer
      id="viewer"
      src="./models/BEARBRICK-MODEL-3D-WOODEN.glb"
      poster="./images/poster.svg"
      alt="BEARBRICK 3D Model"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      rotation-per-second="30deg"
      interaction-prompt="auto"
      shadow-intensity="1.2"
      environment-image="neutral"
      exposure="1"
      style="width:100%; flex:1;"
    >
      <button slot="ar-button" style="
        position: absolute; bottom: 80px; right: 16px;
        background: rgba(255,255,255,.15);
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 24px;
        padding: 10px 20px;
        color: #fff;
        font-size: .85rem;
        backdrop-filter: blur(8px);
        cursor: pointer;
      ">View in AR</button>

      <!-- Loading Progress Bar -->
      <div id="progressWrapper" style="
        position: absolute; bottom: 0; left: 0; width: 100%;
        padding: 0 20px 40px;
        text-align: center;
        pointer-events: none;
      ">
        <div style="
          font-size: .75rem; color: #aaa; letter-spacing: .1em; margin-bottom: 8px;
        "><span id="progressText">LOADING... 0%</span></div>
        <div style="
          width: 100%; max-width: 280px; height: 3px; margin: 0 auto;
          background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden;
        ">
          <div id="progressBar" style="
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #f5d020, #f53803);
            border-radius: 2px;
            transition: width .2s ease;
          "></div>
        </div>
      </div>
    </model-viewer>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <button class="btn-preorder" id="btnPreorder">Waiting List Notify</button>
    </div>

  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>WAITING LIST NOTIFY</h2>
      <form id="preorderForm" novalidate>
        <div class="form-group">
          <label>Name<span class="required">*</span></label>
          <input type="text" name="name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Company<span class="required">*</span></label>
          <input type="text" name="company" placeholder="Company Inc." required />
        </div>
        <div class="form-group">
          <label>Industry<span class="required">*</span></label>
          <input type="text" name="industry" placeholder="e.g. Retail, Art, Fashion" required />
        </div>
        <div class="form-group">
          <label>Phone<span class="required">*</span></label>
          <input type="tel" name="phone" placeholder="090-1234-5678" required />
        </div>
        <div class="form-group">
          <label>Email<span class="required">*</span></label>
          <input type="email" name="email" placeholder="you@example.com" required />
        </div>
        <button type="submit" class="btn-submit" id="btnSubmit">SUBMIT</button>
      </form>
      <button class="btn-close" id="btnClose">Close</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">Thank you! We will contact you soon!</div>

  <script>
    /* =========================================================
     *  Pre-order Form Logic
     * ========================================================= */

    const btnPreorder = document.getElementById('btnPreorder');
    const modalOverlay = document.getElementById('modalOverlay');
    const btnClose     = document.getElementById('btnClose');
    const form         = document.getElementById('preorderForm');
    const btnSubmit    = document.getElementById('btnSubmit');
    const toast        = document.getElementById('toast');
    const viewer       = document.getElementById('viewer');

    // --- Loading progress ---
    const progressWrapper = document.getElementById('progressWrapper');
    const progressBar     = document.getElementById('progressBar');
    const progressText    = document.getElementById('progressText');

    // --- Scale model to real-world size (14cm = 0.14m) ---
    const TARGET_HEIGHT = 0.14; // meters
    viewer.addEventListener('load', () => {
      const center = viewer.getBoundingBoxCenter();
      const size = viewer.getDimensions();
      if (size.y > 0) {
        const scaleFactor = TARGET_HEIGHT / size.y;
        viewer.scale = `${scaleFactor} ${scaleFactor} ${scaleFactor}`;
        console.log(`Model scaled: original height=${size.y}m → target=${TARGET_HEIGHT}m, factor=${scaleFactor.toFixed(4)}`);
      }
    });

    viewer.addEventListener('progress', (e) => {
      const pct = Math.round(e.detail.totalProgress * 100);
      progressBar.style.width = pct + '%';
      progressText.textContent = 'LOADING... ' + pct + '%';
      if (pct >= 100) {
        setTimeout(() => { progressWrapper.style.opacity = '0'; progressWrapper.style.transition = 'opacity .5s'; }, 300);
        setTimeout(() => { progressWrapper.style.display = 'none'; }, 800);
      }
    });

    // --- Modal open / close ---
    btnPreorder.addEventListener('click', () => modalOverlay.classList.add('active'));
    btnClose.addEventListener('click',    () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    // --- Form submit ---
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Collect form data
      const data = {
        name:    form.name.value.trim(),
        company: form.company.value.trim(),
        industry: form.industry.value.trim(),
        phone:   form.phone.value.trim(),
        email:   form.email.value.trim(),
      };

      // Basic validation
      if (!data.name || !data.company || !data.industry || !data.phone || !data.email) {
        alert('Please fill in all required fields.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'SUBMITTING...';

      try {
        await submitPreorder(data);
        // Success
        form.reset();
        modalOverlay.classList.remove('active');
        showToast('Thank you! We will contact you soon!');
      } catch (err) {
        console.error('Submit error:', err);
        alert('Submission failed. Please try again.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'SUBMIT';
      }
    });

    // --- Toast ---
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    /* =========================================================
     *  Submit handler — Google Apps Script 連携用
     * ---------------------------------------------------------
     *  Google Apps Script で Web アプリとしてデプロイした後、
     *  下記の GAS_ENDPOINT に URL を設定してください。
     *
     *  GAS 側の doPost(e) で JSON を受け取り、
     *  スプレッドシートに書き込む想定です。
     * ========================================================= */
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbykz9oAmN1-UHOwFXcUy81Z5uOShCxADWRjcDUDDWlF7ecaaC6U1NxFOlbC01OEoQtf/exec';

    function submitPreorder(data) {
      if (!GAS_ENDPOINT) {
        console.log('[DEV] Pre-order data:', JSON.stringify(data, null, 2));
        return Promise.resolve();
      }

      return new Promise((resolve, reject) => {
        const url = new URL(GAS_ENDPOINT);
        Object.entries(data).forEach(([k, v]) => url.searchParams.append(k, v));
        const img = new Image();
        img.onload = resolve;
        img.onerror = resolve; // GAS returns JSON, not image — onerror is expected but data is sent
        img.src = url.toString();
        setTimeout(resolve, 3000); // fallback timeout
      });
    }
  </script>
</body>
</html>
