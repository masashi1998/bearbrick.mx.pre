<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d020"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Bear silhouette -->
  <g transform="translate(200, 230)">
    <!-- Head -->
    <rect x="-52" y="-110" width="104" height="80" rx="8" fill="url(#gold)" opacity="0.9"/>
    <!-- Ears -->
    <circle cx="-38" cy="-115" r="16" fill="url(#gold)" opacity="0.9"/>
    <circle cx="38" cy="-115" r="16" fill="url(#gold)" opacity="0.9"/>
    <!-- Body -->
    <rect x="-48" y="-25" width="96" height="112" rx="6" fill="#1a1a1a" stroke="url(#gold)" stroke-width="1" opacity="0.9"/>
    <!-- Arms -->
    <rect x="-72" y="-20" width="20" height="100" rx="10" fill="#1a1a1a" opacity="0.9"/>
    <rect x="52" y="-20" width="20" height="100" rx="10" fill="#1a1a1a" opacity="0.9"/>
    <!-- Legs -->
    <rect x="-38" y="92" width="28" height="80" rx="8" fill="#1a1a1a" opacity="0.9"/>
    <rect x="10" y="92" width="28" height="80" rx="8" fill="#1a1a1a" opacity="0.9"/>
    <!-- Feet -->
    <rect x="-42" y="162" width="36" height="20" rx="4" fill="url(#gold)" opacity="0.9"/>
    <rect x="6" y="162" width="36" height="20" rx="4" fill="url(#gold)" opacity="0.9"/>
    <!-- Hands -->
    <circle cx="-62" cy="84" r="14" fill="url(#gold)" opacity="0.9"/>
    <circle cx="62" cy="84" r="14" fill="url(#gold)" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="-20" cy="-72" r="6" fill="white" opacity="0.8"/>
    <circle cx="20" cy="-72" r="6" fill="white" opacity="0.8"/>
    <!-- Belly mark -->
    <circle cx="0" cy="20" r="20" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Loading text -->
  <text x="200" y="440" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#666" letter-spacing="3">LOADING 3D MODEL...</text>
</svg>
